name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-windows.yml
permissions:
  contents: write
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "HARU_RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package Windows application
        run: npx --no-install electron-builder --win --dir --publish never --config.win.signAndEditExecutable=false
      - name: Verify built application startup and note persistence
        run: node scripts/check-packaged-startup.cjs
      - name: Create download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/haru-calendar -Force | Out-Null
          Copy-Item -Path dist/win-unpacked/* -Destination release/haru-calendar -Recurse -Force
          Copy-Item docs/GOOGLE_CALENDAR.md release/haru-calendar/Google-Calendar-설정.md
          Copy-Item README.md release/haru-calendar/README.md
          $filename = "haru-calendar-google-$env:HARU_RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path release/haru-calendar -DestinationPath "release/$filename" -CompressionLevel Optimal
          $digest = (Get-FileHash "release/$filename" -Algorithm SHA256).Hash.ToLower()
          "$digest  $filename" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload files and publish new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:HARU_RELEASE_VERSION"
          $existing = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw 'Refusing to replace an already published version' }
          } else {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --title "하루 달력 $tag — 시작 오류 수정" --notes-file docs/releases/v0.2.1.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $filename = "release/haru-calendar-google-$env:HARU_RELEASE_VERSION-windows-x64.zip"
          gh release upload $tag $filename release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
