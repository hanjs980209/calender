name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-windows.yml
permissions:
  contents: write
concurrency:
  group: release-windows-v0.2.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Package Windows application
        run: npx --no-install electron-builder --win --dir --publish never --config.win.signAndEditExecutable=false
      - name: Create download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/haru-calendar -Force | Out-Null
          Copy-Item -Path dist/win-unpacked/* -Destination release/haru-calendar -Recurse -Force
          Copy-Item docs/GOOGLE_CALENDAR.md release/haru-calendar/Google-Calendar-설정.md
          Copy-Item README.md release/haru-calendar/README.md
          Compress-Archive -Path release/haru-calendar -DestinationPath release/haru-calendar-google-0.2.0-windows-x64.zip -CompressionLevel Optimal
          $digest = (Get-FileHash release/haru-calendar-google-0.2.0-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  haru-calendar-google-0.2.0-windows-x64.zip" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload download files and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.2.0 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --title '하루 달력 v0.2.0 — Google Calendar 연동' --notes 'Windows 실행 ZIP입니다. 전체 압축을 해제한 뒤 하루 달력.exe를 실행하세요. Google 연결 안내는 ZIP에 포함되어 있습니다.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.2.0 release/haru-calendar-google-0.2.0-windows-x64.zip release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v0.2.0 --repo "$env:GITHUB_REPOSITORY" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
