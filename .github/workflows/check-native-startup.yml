name: Diagnose Windows native startup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-native-startup.yml
permissions:
  contents: read
  checks: write
jobs:
  native-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 858390c5ec94e553d0e699b06865b13c2f9fa25e
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Electron development runtime
        run: node -e "console.log(require('electron'))"
      - name: Run unit tests
        run: npm test
      - name: Compare original and corrected startup
        id: startup
        continue-on-error: true
        run: node scripts/check-native-startup.cjs
      - name: Record native startup observations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('native-startup-report.json', 'utf8'));
            const fixed = report.cases.find(c => c.name === 'corrected');
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Electron native startup observations', head_sha: context.sha,
              status: 'completed', conclusion: fixed.status === 0 ? 'success' : 'failure',
              output: {title: 'Windows isolated startup comparison', summary: '```json\n' + JSON.stringify(report, null, 2).slice(0, 20000) + '\n```'}
            });
            if (fixed.status !== 0) core.setFailed('Corrected native startup has not passed');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-observations
          path: |
            *-startup.log
            native-startup-report.json
